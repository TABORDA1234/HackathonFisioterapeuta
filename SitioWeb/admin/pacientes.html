      </div>
      <div>
        <div class="sidebar-brand-name">Fisioterapeuta Li</div>

    </div>
        <nav class="sidebar-nav">

      <a href="dashboard.html" class="nav-item">
        <span class="nav-item-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 17v-4"/><path d="M12 17V9"/><path d="M17 17V5"/></svg></span> Dashboard
      </a>
      <a href="citas.html" class="nav-item">
        <span class="nav-item-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> Agenda & Citas
      </a>
      <div class="nav-section-title">Pacientes</div>
      <a href="pacientes.html" class="nav-item active">
        <span class="nav-item-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Pacientes
      </a>
      <a href="historia-clinica.html" class="nav-item">
        <span class="nav-item-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg></span> Historia Clínica
      </a>
      <div class="nav-section-title">Administración</div>
      <a href="servicios.html" class="nav-item">
        <span class="nav-item-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></span> Servicios
      </a>
      <a href="usuarios.html" class="nav-item">
        <span class="nav-item-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span> Usuarios (Admins)
      </a>
      <a href="auditorias.html" class="nav-item">
        <span class="nav-item-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span> Auditorías
      </a>
      <div class="nav-section-title">Sistema</div>
      <a href="../index.html" target="_blank" class="nav-item">
        <span class="nav-item-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span> Sitio Público
      </a>
      <button class="nav-item" id="btn-logout" style="border:none;background:none;width:100%;text-align:left;cursor:pointer;font-family:var(--font-primary);">

      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">L</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Lina Murillo</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Administrador</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
        <div>
          <div class="topbar-title">Pacientes</div>
          <div class="topbar-breadcrumb">Gestión de pacientes</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" id="btn-nuevo-paciente">+ Nuevo Paciente</button>
      </div>
    </header>

    <main class="admin-content">

      <!-- Búsqueda y filtros -->
      <div class="card" style="margin-bottom:var(--space-xl);">
        <div style="display:flex; gap:var(--space-md); flex-wrap:wrap; align-items:center;">
          <div class="search-bar" style="flex:1; min-width:240px;">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Buscar por nombre, teléfono o correo…" />
          </div>
          <div style="display:flex; gap:var(--space-sm); align-items:center;">
            <span class="badge badge-neutral" id="badge-total">— pacientes</span>
          </div>
        </div>
      </div>

      <!-- Tabla de pacientes -->
      <div class="card" style="padding:0; overflow:hidden;">
        <div class="table-container" id="tabla-pacientes">
          <div class="empty-state"><div class="spinner" style="margin:0 auto;"></div><div class="empty-state-title" style="margin-top:var(--space-md);">Cargando pacientes…</div></div>
        </div>
        <div id="paginacion" style="padding:var(--space-md);"></div>
      </div>

    </main>
  </div>
</div>

<!-- ── Modal Nuevo Paciente ── -->
<div class="modal-overlay hidden" id="modal-paciente">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Nuevo Paciente</div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <form id="form-paciente" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="p-nombre">Nombre completo <span class="required">*</span></label>
          <input type="text" class="form-control" id="p-nombre" placeholder="Nombre completo" />
        </div>
        <div class="form-group">
          <label class="form-label" for="p-telefono">Teléfono / WhatsApp</label>
          <input type="tel" class="form-control" id="p-telefono" placeholder="3XXXXXXXXX" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="p-email">Correo electrónico</label>
          <input type="email" class="form-control" id="p-email" placeholder="correo@ejemplo.com" />
        </div>
        <div class="form-group">
          <label class="form-label" for="p-telegram">ID de Telegram</label>
          <input type="text" class="form-control" id="p-telegram" placeholder="Opcional" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="p-notas">Notas médicas iniciales</label>
        <textarea class="form-control" id="p-notas" rows="3" placeholder="Observaciones iniciales…"></textarea>
      </div>
    </form>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-save">Guardar Paciente</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pacientes.js"></script>
</body>
</html>
