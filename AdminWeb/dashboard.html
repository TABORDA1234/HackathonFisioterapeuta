<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FisioLi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="dashboard-body">
    
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo-admin mb-6">🌿 FisioLi Admin</div>
        <nav class="sidebar-nav">
            <a href="#" class="active" onclick="showTab('agenda')">📅 Agenda del Día</a>
            <a href="#" onclick="showTab('pacientes')">👥 Pacientes y Notas</a>
            <a href="#" onclick="logout()" class="text-red">🚪 Cerrar Sesión</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <h2 id="page-title">Agenda del Día</h2>
            <div class="user-info">
                <span>Hola, <b id="user-name">Admin</b></span>
            </div>
        </header>

        <!-- Tab: Agenda -->
        <section id="tab-agenda" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h3>Citas Programadas</h3>
                    <input type="date" id="agenda-date" class="input">
                </div>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Hora</th>
                                <th>Paciente</th>
                                <th>Servicio</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="agenda-body">
                            <tr><td colspan="5" class="text-center">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Tab: Pacientes -->
        <section id="tab-pacientes" class="tab-content hidden">
            <div class="card">
                <div class="card-header">
                    <h3>Listado de Pacientes</h3>
                    <input type="text" id="search-paciente" class="input" placeholder="Buscar paciente..." onkeyup="buscarPacientes()">
                </div>
                <div class="grid-pacientes" id="pacientes-grid">
                    <!-- Cards de pacientes aquí -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Notas Medicas -->
    <div id="modal-notas" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-paciente-nombre">Notas Médicas</h3>
            <textarea id="notas-texto" rows="10" class="input mt-4 w-full" placeholder="Escribe aquí la evolución clínica del paciente..."></textarea>
            <input type="hidden" id="modal-cliente-id">
            <div class="modal-actions mt-4">
                <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="guardarNotas()">Guardar Notas</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
