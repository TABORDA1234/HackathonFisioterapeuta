<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisioLi - Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="logo-admin">🌿 FisioLi Admin</div>
        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Acceso exclusivo para personal médico.</p>
        
        <form id="login-form">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div id="login-error" class="error-msg hidden">Credenciales inválidas.</div>
            <button type="submit" class="btn btn-primary w-full mt-4" id="btn-login">Entrar al Sistema</button>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('login-error');
            
            btn.textContent = 'Verificando...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok && data.access_token) {
                    localStorage.setItem('fisioli_token', data.access_token);
                    localStorage.setItem('fisioli_user', JSON.stringify(data.usuario));
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Credenciales inválidas';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Error conectando al servidor';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.textContent = 'Entrar al Sistema';
                btn.disabled = false;
            }
        });

        // Redirect if already logged in
        if (localStorage.getItem('fisioli_token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
