services:
  # ── BACKEND (API Flask) ──
  - type: web
    name: fisio-backend
    env: python
    plan: free
    buildCommand: "cd Backend && pip install -r requirements.txt"
    startCommand: "cd Backend && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: N8N_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: HORARIO_INICIO
        value: "08:00"
      - key: HORARIO_FIN
        value: "18:00"
      - key: HORARIO_SABADO_FIN
        value: "13:00"
      - key: DIAS_LABORALES
        value: "0,1,2,3,4,5"
      - key: BUFFER_ENTRE_SESIONES_MIN
        value: "15"
      - key: ANTICIPACION_MINIMA_HORAS
        value: "2"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # ── FRONTEND (Sitio Web Estático) ──
  - type: web
    name: fisio-frontend
    env: static
    buildCommand: "echo 'Frontend build OK'"
    staticPublishPath: ./SitioWeb

  # ── BOT TELEGRAM ──
  - type: web
    name: fisio-bot-telegram
    env: python
    plan: free
    buildCommand: "cd BotTelegram && pip install -r requirements.txt"
    startCommand: "cd BotTelegram && python app.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: BACKEND_URL
        value: "https://fisio-backend-s25s.onrender.com"
