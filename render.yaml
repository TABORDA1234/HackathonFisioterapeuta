services:
  # ── BACKEND (API Flask) ──
  - type: web
    name: fisio-backend
    env: python
    plan: free
    buildCommand: "cd Backend && pip install -r requirements.txt"
    startCommand: "cd Backend && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: N8N_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: HORARIO_INICIO
        value: "08:00"
      - key: HORARIO_FIN
        value: "18:00"
      - key: HORARIO_SABADO_FIN
        value: "13:00"
      - key: DIAS_LABORALES
        value: "0,1,2,3,4,5"
      - key: BUFFER_ENTRE_SESIONES_MIN
        value: "15"
      - key: ANTICIPACION_MINIMA_HORAS
        value: "2"

  # ── FRONTEND (Sitio Web Estático) ──
  - type: web
    name: fisio-frontend
    env: static
    buildCommand: "cd SitioWeb && echo \"window.FISIO_API_URL = 'https://fisio-backend.onrender.com/api';\" > config.js && sed -i '1i<script src=\"config.js\"></script>' index.html"
    staticPublishPath: ./SitioWeb


